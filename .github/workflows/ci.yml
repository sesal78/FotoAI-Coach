name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs_space
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install (clean, from the one lockfile)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: FotoAI tests
        run: npm run test:fotoai

      - name: Next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
