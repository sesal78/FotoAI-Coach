
version: '3.8'

services:
  # Next.js App
  app:
    build:
      # pnpm workspace: build from the repo root
      context: ..
      dockerfile: nextjs_space/Dockerfile
      args:
        ABACUSAI_API_KEY: ${ABACUSAI_API_KEY}
        SENDGRID_API_KEY: ${SENDGRID_API_KEY}
        OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
        FROM_EMAIL: ${FROM_EMAIL}
        FROM_NAME: ${FROM_NAME:-Foto Coach}
        USER_EMAIL: ${USER_EMAIL}
    container_name: foto-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ABACUSAI_API_KEY: ${ABACUSAI_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      FROM_NAME: ${FROM_NAME:-Foto Coach}
      USER_EMAIL: ${USER_EMAIL}
      NODE_ENV: production
    networks:
      - foto-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Cron Scheduler
  scheduler:
    image: alpine:3.19
    container_name: foto-scheduler
    restart: unless-stopped
    volumes:
      - ./crontab:/etc/crontabs/root
      - ./logs:/var/log/foto
    command: crond -f -l 2
    networks:
      - foto-network
    depends_on:
      - app

networks:
  foto-network:
    driver: bridge
