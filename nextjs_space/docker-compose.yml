
version: '3.8'

# NOTE: Appwrite runs as a SEPARATE service in Dokploy.
# Deploy Appwrite first using its official docker-compose, then point this app at it.
# See: https://appwrite.io/docs/advanced/self-hosting

services:
  # Next.js App
  app:
    build:
      # pnpm workspace: build from the repo root
      context: ..
      dockerfile: nextjs_space/Dockerfile
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
        APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
        APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
        APPWRITE_API_KEY: ${APPWRITE_API_KEY}
        APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID}
        APPWRITE_STORAGE_BUCKET_ID: ${APPWRITE_STORAGE_BUCKET_ID}
        ABACUSAI_API_KEY: ${ABACUSAI_API_KEY}
        SENDGRID_API_KEY: ${SENDGRID_API_KEY}
        OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
        FROM_EMAIL: ${FROM_EMAIL}
        FROM_NAME: ${FROM_NAME:-Foto Coach}
        USER_EMAIL: ${USER_EMAIL}
    container_name: foto-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT}
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID}
      APPWRITE_STORAGE_BUCKET_ID: ${APPWRITE_STORAGE_BUCKET_ID}
      ABACUSAI_API_KEY: ${ABACUSAI_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      FROM_NAME: ${FROM_NAME:-Foto Coach}
      USER_EMAIL: ${USER_EMAIL}
      NODE_ENV: production
    networks:
      - foto-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Cron Scheduler
  scheduler:
    image: alpine:3.19
    container_name: foto-scheduler
    restart: unless-stopped
    volumes:
      - ./crontab:/etc/crontabs/root
      - ./logs:/var/log/foto
    command: crond -f -l 2
    networks:
      - foto-network
    depends_on:
      - app

networks:
  foto-network:
    driver: bridge
