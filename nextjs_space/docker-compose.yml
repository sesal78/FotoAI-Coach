
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: foto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-foto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - foto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-foto}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-foto}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        SENDGRID_API_KEY: ${SENDGRID_API_KEY}
        OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
        FROM_EMAIL: ${FROM_EMAIL:-noreply@myfoto.topues.com}
        USER_EMAIL: ${USER_EMAIL:-seun@example.com}
    container_name: foto-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foto}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-foto}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@myfoto.topues.com}
      USER_EMAIL: ${USER_EMAIL:-seun@example.com}
      NODE_ENV: production
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foto-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cron Scheduler
  scheduler:
    image: alpine:3.19
    container_name: foto-scheduler
    restart: unless-stopped
    volumes:
      - ./crontab:/etc/crontabs/root
      - ./logs:/var/log/foto
    command: crond -f -l 2
    networks:
      - foto-network
    depends_on:
      - app

volumes:
  postgres_data:

networks:
  foto-network:
    driver: bridge
